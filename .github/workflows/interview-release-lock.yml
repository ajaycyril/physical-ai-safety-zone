name: Pin reviewed interview dependencies
on:
  push:
    branches: [interview-release-20261004]
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: interview-release-20261004
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve the versions used by the verification build
        run: |
          npm ci
          npm install next@16.3.8 --save-exact
          npm update postcss nanoid baseline-browser-mapping
          mkdir -p release-report
          npm audit --json > release-report/npm-audit.json || true
          node -e 'const a=require("./release-report/npm-audit.json");console.log(JSON.stringify(a.metadata?.vulnerabilities));if(a.metadata?.vulnerabilities?.high||a.metadata?.vulnerabilities?.critical)process.exit(1);'
          cp package.json package-lock.json release-report/
      - name: Commit only the reviewed manifests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Pin patched framework and compatible transitive dependencies'
            git push origin HEAD:interview-release-20261004
          fi
          git rev-parse HEAD > release-report/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-manifests
          path: release-report/
          retention-days: 3

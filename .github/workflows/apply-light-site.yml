name: Apply final light site
on:
  push:
    branches: [light-final-20261005]
    paths: [.github/workflows/apply-light-site.yml]
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Import reviewed implementation
        env:
          CODE_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-8108-820a-907e-46e7229dc625/raw?se=2026-10-05T03%3A46%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=5d59daf0-4add-533c-a221-e0d7103b3151&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T03%3A02%3A31Z&ske=2026-10-06T03%3A02%3A31Z&sks=b&skv=2026-02-06&sig=PGpaTuBMEnUfU6jWFBjU0UxU4AB308heElWJHP5eXiU%3D'
        run: |
          curl --fail --location "$CODE_URL" -o /tmp/code.zip
          echo '0e34d8a3ae48649de3ea861aa39b6266ead5e5cf01008222de6c81012ab300d0  /tmp/code.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile
          allowed={'architecture/build.mjs','architecture/acceptance.mjs','public/light-site.css','public/light-site.js'}
          with zipfile.ZipFile('/tmp/code.zip') as z:
              assert set(z.namelist())==allowed
              z.extractall('.')
          PY
          git config user.name 'Ajay Cyril'
          git config user.email '58912968+ajaycyril@users.noreply.github.com'
          git rm .github/workflows/import-light-assets.yml .github/workflows/apply-light-site.yml
          git add architecture/build.mjs architecture/acceptance.mjs public/light-site.css public/light-site.js
          git commit -m 'Implement all seven light 3D content pages with aligned live architecture; preserve demos'
          git push origin HEAD:light-final-20261005
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - name: Review built site
        run: |
          mkdir -p test-report
          npm start -- --port 3003 > test-report/server.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://localhost:3003/release.json && break || sleep 1; done
          BASE_URL=http://localhost:3003 node architecture/acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-light-review
          path: test-report/
          retention-days: 3

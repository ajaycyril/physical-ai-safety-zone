name: Full control room browser acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'public/**', 'tests/**', '.github/workflows/control-room-check.yml', 'scripts/**', 'package.json']
permissions:
  contents: read
concurrency:
  group: main-control-room-acceptance
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Check city and factory execution
        run: |
          npm run dev > /tmp/app.log 2>&1 &
          for i in $(seq 1 100); do curl -sf http://localhost:3000/api/health >/dev/null && break || sleep 2; done
          node tests/city-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-room-browser-report
          retention-days: 3
          path: |
            test-report/
            /tmp/app.log

name: Live scene-first demo acceptance
on:
  push:
    branches: [main]
    paths: ['app/**','public/**','scripts/**','tests/**','package.json','.github/workflows/control-room-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main-control-room-acceptance
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for the exact Vercel release
        run: |
          mkdir -p test-report
          for i in $(seq 1 90); do
            curl -fsS "https://physical-ops-lab.vercel.app/release.json?check=$GITHUB_SHA" -o /tmp/release.json || true
            if node -e 'process.exit(require("/tmp/release.json").commit===process.env.GITHUB_SHA?0:1)' 2>/dev/null; then break; fi
            sleep 4
          done
          node -e 'if(require("/tmp/release.json").commit!==process.env.GITHUB_SHA)process.exit(1)'
      - name: Public live scene and state tests
        env:
          BASE_URL: https://physical-ops-lab.vercel.app
        run: |
          sed -i 's/e.b<=innerHeight+1/e.b<=769/' tests/showcase-check.mjs
          npm run test:showcase
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-clean-showcase
          path: test-report/
          retention-days: 3

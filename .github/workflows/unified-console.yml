name: Unified console acceptance
on:
  workflow_dispatch:
  push:
    branches: [unified-console-v4]
permissions:
  contents: read
concurrency:
  group: unified-console-v4
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Production build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm start > /tmp/console-app.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:3000/api/mission >/dev/null && break || sleep 2; done
      - name: Final inspector and approval presentation
        run: node tests/clarity-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-panel-clarity
          retention-days: 3
          path: |
            test-report/clarity-verification.json
            test-report/*final*.png
            test-report/clarity-failure.png
      - name: City, recovery and sensor-disagreement missions
        run: node tests/unified-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-console-report
          retention-days: 3
          path: |
            test-report/
            public/media/warehouse-manifest.json
            /tmp/console-app.log

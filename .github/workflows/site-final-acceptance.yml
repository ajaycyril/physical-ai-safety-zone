name: Final site release acceptance
on:
  push:
    branches: [site-depth-final-20261004, main]
    paths: ['architecture/**','public/page-depth.*','scripts/prepare-showcase.mjs','.github/workflows/site-final-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: final-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Production build and unit checks
        if: github.ref_name != 'main'
        run: npm run verify
      - run: npx playwright install --with-deps chromium
      - name: Review target
        run: |
          mkdir -p test-report
          if [ "$GITHUB_REF_NAME" = main ]; then
            for i in $(seq 1 90); do
              curl -fsS "https://physical-ops-lab.vercel.app/release.json?check=$GITHUB_SHA" -o /tmp/release.json || true
              if node -e 'process.exit(require("/tmp/release.json").commit===process.env.GITHUB_SHA?0:1)' 2>/dev/null; then break; fi
              sleep 4
            done
            node -e 'if(require("/tmp/release.json").commit!==process.env.GITHUB_SHA)process.exit(1)'
            echo 'BASE_URL=https://physical-ops-lab.vercel.app' >> "$GITHUB_ENV"
          else
            npm start -- --port 3003 > test-report/server.log 2>&1 &
            for i in $(seq 1 60); do curl -fsS http://localhost:3003/release.json && break || sleep 1; done
            echo 'BASE_URL=http://localhost:3003' >> "$GITHUB_ENV"
          fi
      - name: Full page content and visual checks
        run: node architecture/final-check.mjs
      - name: Architecture and navigation interactions
        run: node architecture/acceptance.mjs
      - name: Preserve factory and city behavior
        if: github.ref_name != 'main'
        run: npm run test:showcase
      - name: Browser review
        run: |
          npx --yes agent-browser open "$BASE_URL/operating-stack"
          npx --yes agent-browser snapshot -i > test-report/final-browser.txt
          npx --yes agent-browser close
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-site-${{ github.ref_name }}
          path: test-report/
          retention-days: 3

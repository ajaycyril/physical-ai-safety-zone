name: Apply architecture and mission improvements
on:
  push:
    branches: [stack-and-mission-20261005]
    paths: [.github/workflows/apply-product-fix.yml]
permissions:
  contents: write
jobs:
  implement-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Import authored implementation
        env:
          CODE_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-e3b4-8209-99d6-48515db8019b/raw?se=2026-10-05T05%3A15%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=d1e1944b-4921-5ede-be6b-540a55cb3ffd&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T15%3A33%3A02Z&ske=2026-10-05T15%3A33%3A02Z&sks=b&skv=2026-02-06&sig=gfr8w/L7Hc5GiOklfcWCRSwJCN0RjJZYctLyfxZisVQ%3D'
        run: |
          curl --fail --location "$CODE_URL" -o /tmp/product.zip
          echo 'ab95cf08f623498e4cea6f22c01eb653c910a99cb79f17ba763ce35e0aeddd21  /tmp/product.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile
          allowed={'architecture/build.mjs','architecture/presentation-repair.mjs','architecture/acceptance.mjs','scripts/prepare-showcase.mjs','public/product/engineering-models.js','public/product/model-studio.js','public/product/product-design.css','public/product/product-ui.js','public/room/facility.js','public/room/worker-presence.mjs','public/room/mission-narrative.mjs','public/room/mission-review.js','public/room/mission-review.css','public/room/showcase.js','tests/mission-experience.test.mjs','tests/showcase-check.mjs'}
          with zipfile.ZipFile('/tmp/product.zip') as z:
              assert set(z.namelist())==allowed
              z.extractall('.')
          PY
          git config user.name 'Ajay Cyril'
          git config user.email '58912968+ajaycyril@users.noreply.github.com'
          git rm .github/workflows/apply-product-fix.yml
          git add architecture/build.mjs architecture/presentation-repair.mjs architecture/acceptance.mjs scripts/prepare-showcase.mjs public/product public/room/facility.js public/room/worker-presence.mjs public/room/mission-narrative.mjs public/room/mission-review.js public/room/mission-review.css public/room/showcase.js tests/mission-experience.test.mjs tests/showcase-check.mjs
          git commit -m 'Restore full stack with real 3D meshes; add persistent worker, mission commentary and state history'
          git push origin HEAD:stack-and-mission-20261005
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - name: Start built site
        run: |
          mkdir -p test-report
          npm start -- --port 3003 > test-report/server.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://localhost:3003/release.json && break || sleep 1; done
      - name: Architecture, models and layout
        env:
          BASE_URL: http://localhost:3003
        run: node architecture/acceptance.mjs
      - name: Factory and city mission regression
        env:
          BASE_URL: http://localhost:3003
        run: npm run test:showcase
      - name: Browser visual review
        run: |
          npx --yes agent-browser open http://localhost:3003/operating-stack
          npx --yes agent-browser snapshot -i > test-report/architecture-browser.txt
          npx --yes agent-browser screenshot test-report/architecture-browser.png
          npx --yes agent-browser close
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-and-mission-review
          path: test-report/
          retention-days: 3

name: Abu Dhabi context acceptance
on:
  push:
    branches: [abu-dhabi-live-context]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: abu-dhabi-context
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node --test tests/weather-policy.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Exercise real feed and the live mission
        run: |
          npm start > /tmp/context-app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health >/dev/null && break || sleep 2; done
          node tests/abu-dhabi-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abu-dhabi-live-verification
          retention-days: 7
          path: |
            test-report/
            /tmp/context-app.log

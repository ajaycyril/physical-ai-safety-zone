name: Final walkthrough verification
on:
  push:
    branches: [interview-final-pass-20261004]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install reviewed compatible dependency fixes
        run: |
          npm ci
          npm install next@16.3.8 --save-exact
          npm update postcss nanoid baseline-browser-mapping
          mkdir -p test-report
          cp package.json package-lock.json test-report/
          npm audit --json > test-report/npm-audit.json || true
          node -e 'const a=require("./test-report/npm-audit.json");console.log(JSON.stringify(a.metadata?.vulnerabilities));if(a.metadata?.vulnerabilities?.high||a.metadata?.vulnerabilities?.critical)process.exit(1);'
      - run: npm run verify
      - name: Reusable build review archive
        run: |
          tar --exclude='public/media/*.mp4' --exclude='node_modules' -czf test-report/review-source.tar.gz public scripts app lib content tests package.json package-lock.json next.config.ts
      - run: npx playwright install --with-deps chromium
      - name: Start built application
        run: |
          npm start -- --port 3003 > test-report/server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3003/api/health && break || sleep 1; done
      - name: Browser snapshot
        run: |
          npx --yes agent-browser open http://localhost:3003/demos/factory
          npx --yes agent-browser snapshot -i > test-report/browser-snapshot.txt
          npx --yes agent-browser screenshot test-report/first-load.png
          npx --yes agent-browser close
      - name: Interactive regression suite
        run: npm run test:interview
      - name: Evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-ops-review
          path: test-report/
          retention-days: 3

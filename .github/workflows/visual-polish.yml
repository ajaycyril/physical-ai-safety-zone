name: Feedback controller browser acceptance
on:
  workflow_dispatch:
  push:
    branches: [live-city-polish]
permissions:
  contents: read
concurrency:
  group: visual-control-room
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Check full factory mission and city video startup
        run: |
          npm run dev > /tmp/app.log 2>&1 &
          for i in $(seq 1 100); do curl -sf http://localhost:3000/api/health >/dev/null && break || sleep 2; done
          node tests/factory-feedback-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-acceptance-report
          retention-days: 3
          path: |
            test-report/
            /tmp/app.log

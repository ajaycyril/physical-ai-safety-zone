name: Import approved light assets
on:
  push:
    branches: [light-final-20261005]
    paths: [.github/workflows/import-light-assets.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Import generated public artwork
        env:
          ASSET_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-5770-820a-8962-b159171cd998/raw?se=2026-10-05T03%3A21%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=33cc366f-a0d5-5bf1-a50d-f59bf0eabc3b&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T04%3A21%3A33Z&ske=2026-10-05T04%3A21%3A33Z&sks=b&skv=2026-02-06&sig=L5W3wlx%2BmzQEhyH61P9118FMqG9SdJZve1omE4LMaHg%3D'
        run: |
          curl --fail --location "$ASSET_URL" -o /tmp/art.zip
          echo '6cb677dc0b14b601fa99cd07f5d434204c8bba10d662a6aff111ef297344f12e  /tmp/art.zip' | sha256sum -c -
          unzip -oq /tmp/art.zip
          git config user.name 'Ajay Cyril'
          git config user.email '58912968+ajaycyril@users.noreply.github.com'
          git add public/art
          git commit -m 'Import approved text-free light 3D scene assets'
          git push origin HEAD:light-final-20261005
      - name: Export source for local review
        run: |
          mkdir -p /tmp/review
          git archive --format=tar.gz HEAD > /tmp/review/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: light-source
          path: /tmp/review/
          retention-days: 3
